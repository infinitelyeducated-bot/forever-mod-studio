<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Mod Studio</title>
<style>
  :root { --bg: #111317; --panel: #1b1e25; --line: #2e333d; --text: #dfe3ea; --dim: #8d95a3; --accent: #e3b341; --err: #ff8f7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  body.compact #bar, body.compact #status, body.compact #logwrap { display: none; }
  #mini { display: none; position: fixed; left: 8px; top: 8px; z-index: 5; gap: 6px; }
  body.compact #mini, body.wasCompact #mini { display: flex; }
  #mini button { padding: 3px 9px; font-size: 12px; opacity: 0.85; }
  #mini button:hover { opacity: 1; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #bar .grp { display: flex; align-items: center; gap: 6px; }
  #bar label { color: var(--dim); white-space: nowrap; }
  #bar label.chk { color: var(--text); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  select, button, input[type=text], input[type=search] { background: #262a33; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover, select:hover { border-color: #4a5160; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: #4a3a12; border-color: #7d6220; color: #ffe9a8; }
  #pick { min-width: 190px; text-align: left; font-weight: 600; }
  #pick::after { content: " \25BE"; color: var(--dim); }
  input[type=text] { width: 150px; }
  #view { flex: 1; overflow: auto; position: relative; background: #000; min-height: 120px; }
  #stage { display: block; cursor: default; }
  #logwrap { display: none; flex-direction: column; height: 132px; border-top: 1px solid var(--line); background: #0c0d10; }
  #logwrap.open { display: flex; }
  #loghead { display: flex; gap: 10px; align-items: center; padding: 3px 12px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--dim); }
  #loghead b { color: var(--text); font-weight: 600; }
  #loghead .sp { flex: 1; }
  #loghead button { padding: 1px 8px; }
  #log { flex: 1; overflow: auto; padding: 6px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  #log .e { color: var(--err); }
  #log .s { color: #8fb8ff; }
  #log .w { color: #e3c36a; }
  #status { padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); display: flex; gap: 16px; align-items: center; min-height: 28px; }
  #status .err { color: var(--err); }
  #status #msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #errs { color: var(--err); font-weight: 600; }
  #errs.none { color: var(--dim); font-weight: 400; }
  .hint { color: var(--dim); white-space: nowrap; }
  /* addon picker */
  #picker { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-start; justify-content: center; z-index: 10; }
  #picker.open { display: flex; }
  #pickbox { margin-top: 48px; width: min(760px, 94vw); max-height: calc(100vh - 96px); background: var(--panel); border: 1px solid #4a5160; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 16px 60px rgba(0,0,0,0.6); }
  #pickhead { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  #pickhead .row { display: flex; gap: 8px; align-items: center; }
  #pickhead .row label { color: var(--dim); white-space: nowrap; }
  #search { flex: 1; font-size: 15px; padding: 7px 10px; }
  #also { flex: 1; }
  #folderline { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #list { overflow: auto; padding: 6px; }
  .item { padding: 7px 10px; border-radius: 5px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .item:hover, .item.sel { background: #2a2f3a; }
  .item .t { font-weight: 600; }
  .item .f { color: var(--dim); font-size: 12px; }
  .item .n { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .tag.x { color: #e3c36a; border-color: #6b5a25; }
  .tag.s { color: #9fd08a; border-color: #3f6a33; }
  #empty { padding: 24px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<div id="bar">
  <div class="grp"><button id="pick" title="Choose an addon from the game's AddOns folder">Choose addon</button></div>
  <div class="grp"><label for="startfrom">Start from</label>
    <select id="startfrom" title="Which settings the addon starts with">
      <option value="auto">Studio's last state, else the game's</option>
      <option value="state">Studio's last state</option>
      <option value="game">Game's saved settings (import)</option>
      <option value="fresh">Fresh install</option>
      <option value="showcase">Everything switched on (HUDs)</option>
    </select></div>
  <div class="grp"><label for="cls">Class</label>
    <select id="cls" title="The class of the simulated character">
      <option value="auto">Auto</option><option>Warrior</option><option>Rogue</option><option>Mage</option><option>Priest</option><option>Warlock</option>
      <option>Hunter</option><option>Druid</option><option>Shaman</option><option>Paladin</option>
    </select></div>
  <div class="grp"><button id="options" class="primary" title="Runs the addon's first slash command">Open options</button><button id="reload" title="Save, then load the addon's files again">Reload</button></div>
  <div class="grp"><button id="save" title="Write the addon's SavedVariables to the studio's state folder">Save</button><button id="export" title="Write a copy to the exports folder, with a note on where it goes in the game">Export...</button></div>
  <div class="grp"><label for="target">Target</label>
    <select id="target">
      <option value="enemy">Enemy</option><option value="friend">Friendly player</option>
      <option value="boss">Boss</option><option value="none">None</option>
    </select>
    <label class="chk"><input type="checkbox" id="combat" checked> In combat</label>
    <label class="chk"><input type="checkbox" id="auto" checked> Activity</label>
  </div>
  <div class="grp"><label for="zoom">Zoom</label>
    <select id="zoom"><option value="fit">Fit width</option><option value="fith">Fit height</option><option value="hud">Fit the HUD</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></div>
  <div class="grp"><button id="bgpick">Background...</button><button id="bgreset" title="Back to the sunset screenshot">Reset</button><input type="file" id="bgfile" accept="image/*" hidden></div>
  <div class="grp"><input type="text" id="slash" placeholder="slash command" title="Type a slash command and press Enter. /run <lua> and /reload work as in the game."></div>
</div>
<div id="mini"><button id="minibar" title="Show or hide the toolbar">Toolbar</button><button id="miniopt" class="primary" title="Open this addon's options window">Options</button></div>
<div id="view"><canvas id="stage"></canvas></div>
<div id="logwrap" class="open">
  <div id="loghead"><b>Log</b><span id="errs" class="none">no Lua errors</span><span class="sp"></span>
    <button id="logcopy">Copy</button><button id="logclear">Clear</button></div>
  <div id="log"></div>
</div>
<div id="status"><span id="msg">Loading...</span><span class="hint">With the options window open: CTRL + left drag moves, CTRL + wheel sizes, CTRL + right drag turns. Esc closes.</span><button id="logbtn">Log</button></div>

<div id="picker">
  <div id="pickbox">
    <div id="pickhead">
      <div class="row"><input type="search" id="search" placeholder="Search addons by name, title or notes" autocomplete="off"></div>
      <div class="row"><label for="also">Also load</label><input type="text" id="also" placeholder="other addons to load alongside, comma separated" title="Addons the game would have loaded anyway because they are enabled (for example ForeverArt for the HUD menus). Dependencies named in the .toc are loaded without being listed here."></div>
      <div class="row"><span id="folderline"></span><button id="folder" title="Choose the game folder (the one that contains Interface and WTF)">Game folder...</button></div>
    </div>
    <div id="list"></div>
  </div>
</div>
<input type="color" id="colour" hidden>
<script src="fengari-web.js"></script>
<script src="studio.js"></script>
</body>
</html>
